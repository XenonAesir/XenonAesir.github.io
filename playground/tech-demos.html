<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技术栈试验：拖尾像素 / 粒子场</title>
<style>
  :root {
    --bg: #0b1020;
    --fg: #cbd4e5;
    --muted: #7f8dad;
    --line: rgba(160, 185, 225, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.7 ui-sans-serif, system-ui, "Noto Sans SC", sans-serif; }
  header {
    position: fixed; inset: 0 0 auto; z-index: 10;
    display: flex; gap: 20px; align-items: center;
    padding: 14px 24px; font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
    background: linear-gradient(var(--bg), transparent);
  }
  header a { color: inherit; text-decoration: none; }
  header a:hover { color: var(--fg); }
  section {
    position: relative; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .caption {
    position: relative; z-index: 2; text-align: center; pointer-events: none;
    background: color-mix(in oklab, var(--bg) 70%, transparent);
    padding: 12px 20px; border: 1px solid var(--line);
  }
  .caption h1 { margin: 0 0 4px; font-size: 22px; font-weight: 400; letter-spacing: .1em; }
  .caption p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  /* 粒子区块的标题挪到顶部，别压住字形 */
  #particles .caption { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); }

  /* ── 一、拖尾像素 ── */
  #trail-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .trail-pixel {
    transform-box: fill-box;
    transform-origin: 50%;
    transform: scale(1);
    transition: transform .5s cubic-bezier(.3, .41, .04, 1.01);
  }
  .trail-pixel.exit { transform: scale(0); }

  /* ── 二、粒子场 ── */
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 三、滚动变形 ── */
  /* overflow 必须可见，否则 sticky 的 canvas 不会相对视口固定 */
  #morph { position: relative; height: auto; display: block; overflow: visible; }
  #morph-canvas {
    position: sticky; top: 0;
    width: 100%; height: 100vh; display: block; z-index: 0;
  }
  .chapters { position: relative; margin-top: -100vh; z-index: 1; }
  .chapter {
    height: 100vh; display: flex; align-items: center; justify-content: flex-start;
    padding-left: 8vw; pointer-events: none;
  }
  .chapter span {
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--muted); background: color-mix(in oklab, var(--bg) 65%, transparent);
    padding: 8px 14px; border: 1px solid var(--line);
  }

  /* ── 四、波点阵 ── */
  #dots { position: relative; }
  #dot-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 五、雨滴沉积 ── */
  #rain { position: relative; }
  #rain-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 六、聚光 + 线条生长 ── */
  #spot { position: relative; }
  #spot::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(520px at var(--mx, 50%) var(--my, 40%),
                rgba(114, 168, 216, 0.16), transparent 70%);
  }
  .grow-wrap { position: relative; z-index: 2; width: min(760px, 80vw); }
  .grow-wrap h1 {
    margin: 0 0 18px; font-size: 34px; font-weight: 300;
    letter-spacing: .12em; color: var(--fg);
  }
  .grow-wrap p { margin: 0 0 26px; color: var(--muted); font-size: 13px; letter-spacing: .1em; }
  .grow-line { display: block; width: 100%; height: 2px; overflow: visible; }
  .grow-line path { stroke: #72a8d8; stroke-width: 1.5; fill: none; }
</style>
</head>
<body>

<header>
  <a href="#trail">① 拖尾像素</a>
  <a href="#particles">② 粒子场</a>
  <a href="#morph">③ 滚动变形</a>
  <a href="#dots">④ 波点阵</a>
  <a href="#rain">⑤ 雨滴沉积</a>
  <a href="#spot">⑥ 聚光</a>
</header>

<!-- ══════════ 一、GitHub 式拖尾像素 ══════════ -->
<section id="trail">
  <svg id="trail-svg" viewBox="0 0 143 84" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
        <path d="M 1 0 H 0 V 1" fill="none" stroke="rgba(160,185,225,0.10)" stroke-width="0.08"/>
      </pattern>
    </defs>
    <rect width="143" height="84" fill="url(#grid)"/>
    <g id="trail-layer"></g>
  </svg>

  <div class="caption">
    <h1>拖尾像素</h1>
    <p>鼠标划过 · 1×1 单位 = 屏幕 10px · scale 0.5s 退场</p>
  </div>
</section>

<!-- ══════════ 二、2D canvas 粒子场 ══════════ -->
<section id="particles">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="caption">
    <h1>粒子场</h1>
    <p>TypedArray · 种子随机 · 遮罩采样 · 鼠标排斥</p>
  </div>
</section>

<!-- ══════════ 三、滚动驱动的形态切换 ══════════ -->
<section id="morph">
  <canvas id="morph-canvas" aria-hidden="true"></canvas>
  <div class="chapters">
    <div class="chapter" data-state="logo"><span>① 标识 · LOGO</span></div>
    <div class="chapter" data-state="lattice"><span>② 晶格 · LATTICE</span></div>
    <div class="chapter" data-state="venn"><span>③ 维恩 · VENN</span></div>
    <div class="chapter" data-state="chladni"><span>④ 克拉尼图形 · CHLADNI</span></div>
    <div class="chapter" data-state="stream"><span>⑤ 流 · STREAM</span></div>
    <div class="chapter" data-state="loop"><span>⑥ 环 · LOOP</span></div>
    <div class="chapter" data-state="drift"><span>⑦ 弥散 · DRIFT</span></div>
  </div>
</section>

<!-- ══════════ 四、波点阵 ══════════ -->
<section id="dots">
  <canvas id="dot-canvas" aria-hidden="true"></canvas>
  <div class="caption">
    <h1>波点阵</h1>
    <p>固定点阵 · 行进波带 · 鼠标涟漪</p>
  </div>
</section>

<!-- ══════════ 五、雨滴沉积 ══════════ -->
<section id="rain">
  <canvas id="rain-canvas" aria-hidden="true"></canvas>
  <div class="caption">
    <h1>雨滴沉积</h1>
    <p>高度图 · 落点堆积 · 缓慢蒸发</p>
  </div>
</section>

<!-- ══════════ 六、聚光 + 线条生长 ══════════ -->
<section id="spot">
  <div class="grow-wrap">
    <h1>聚光与线条</h1>
    <p>鼠标驱动光晕 · 滚动驱动线条生长</p>
    <svg class="grow-line" viewBox="0 0 760 2" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 1 H760" />
    </svg>
    <svg class="grow-line" viewBox="0 0 760 2" preserveAspectRatio="none" aria-hidden="true" style="margin-top:8px">
      <path d="M0 1 H760" />
    </svg>
  </div>
</section>

<script>
(() => {
  "use strict";

  /* ─────────────────────────────
     一、拖尾像素（复刻 GitHub 的做法）
     屏幕坐标 → 143×84 网格 → 插 1×1 <rect> → scale(0) 退场
     ───────────────────────────── */
  const svg = document.getElementById("trail-svg");
  const layer = document.getElementById("trail-layer");
  const NS = "http://www.w3.org/2000/svg";
  const COLS = 143, ROWS = 84;
  const PALETTE = ["#5FED83", "#23EA57", "#08872B", "#C898FD", "#FFB757"];
  const THROTTLE_MS = 30;

  let lastSpawn = 0;

  svg.addEventListener("pointermove", (event) => {
    const now = performance.now();
    if (now - lastSpawn < THROTTLE_MS) return;
    lastSpawn = now;

    const box = svg.getBoundingClientRect();
    const gx = Math.floor(((event.clientX - box.left) / box.width) * COLS);
    const gy = Math.floor(((event.clientY - box.top) / box.height) * ROWS);
    if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;

    const pixel = document.createElementNS(NS, "rect");
    pixel.setAttribute("x", gx);
    pixel.setAttribute("y", gy);
    pixel.setAttribute("width", 1);
    pixel.setAttribute("height", 1);
    pixel.setAttribute("fill", PALETTE[(Math.random() * PALETTE.length) | 0]);
    pixel.setAttribute("class", "trail-pixel");
    layer.appendChild(pixel);

    // 两帧之后再加退出类，确保 scale(1) 已经生效
    requestAnimationFrame(() => requestAnimationFrame(() => pixel.classList.add("exit")));
    pixel.addEventListener("transitionend", () => pixel.remove(), { once: true });
  });

  /* ─────────────────────────────
     二、粒子场（复刻 innuno 的做法）
     Float32Array + mulberry32 + Box-Muller + 遮罩采样 + 亮度分桶
     ───────────────────────────── */
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d");
  const COUNT = 1400;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  function mulberry32(seed) {
    return () => {
      seed |= 0;
      let t = Math.imul((seed = (seed + 0x6d2b79f5) | 0), seed >>> 15 | 1);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(0x134b101);
  const gauss = () => Math.sqrt(-2 * Math.log(rand() || 1e-9)) * Math.cos(2 * Math.PI * rand());

  // 用文字做遮罩，采样不透明像素作为粒子的家
  function sampleMask(text) {
    const off = document.createElement("canvas");
    off.width = 560; off.height = 180;
    const c = off.getContext("2d");
    c.fillStyle = "#fff";
    c.font = "600 96px ui-serif, Georgia, serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(text, 280, 92);

    const px = c.getImageData(0, 0, off.width, off.height).data;
    const points = [];
    for (let y = 0; y < off.height; y += 2) {
      for (let x = 0; x < off.width; x += 2) {
        if (px[(y * off.width + x) * 4 + 3] > 140) points.push(x / off.width, y / off.height);
      }
    }
    return points;
  }

  const mask = sampleMask("RAIN LAND");
  const anchorCount = mask.length / 2;

  const homeX = new Float32Array(COUNT);
  const homeY = new Float32Array(COUNT);
  const posX = new Float32Array(COUNT);
  const posY = new Float32Array(COUNT);
  const scale = new Float32Array(COUNT);
  const ease = new Float32Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    const pick = ((rand() * anchorCount) | 0) * 2;
    homeX[i] = mask[pick];
    homeY[i] = mask[pick + 1];
    posX[i] = 0.5 + gauss() * 0.12;
    posY[i] = 0.5 + gauss() * 0.12;
    scale[i] = 1.2 + rand() * 2.6;
    ease[i] = 0.03 + rand() * 0.05;
  }

  let W = 0, H = 0, DPR = 1;
  const pointer = { x: -9999, y: -9999, active: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  canvas.parentElement.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
    pointer.active = true;
  });
  canvas.parentElement.addEventListener("pointerleave", () => { pointer.active = false; });

  let raf = 0, prev = 0;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = prev ? Math.min(now - prev, 50) : 16.7;
    prev = now;

    const cx = W * 0.5, cy = H * 0.5;
    // 按遮罩（560×180）的宽高比等比铺开，避免字形被拉出屏幕
    const textW = Math.min(W * 0.76, 880);
    const textH = (textW * 180) / 560;

    if (!reduceMotion.matches) {
      for (let i = 0; i < COUNT; i++) {
        const tx = cx + (homeX[i] - 0.5) * textW;
        const ty = cy + (homeY[i] - 0.5) * textH;
        const k = 1 - Math.pow(1 - ease[i], dt / 16.7);
        posX[i] += (tx - posX[i]) * k;
        posY[i] += (ty - posY[i]) * k;

        if (pointer.active) {
          const dx = posX[i] - pointer.x;
          const dy = posY[i] - pointer.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < 8464) {
            const dist = Math.sqrt(distSq) || 1;
            const push = (1 - dist / 92) * 2.4 * (dt / 16.7);
            posX[i] += (dx / dist) * push;
            posY[i] += (dy / dist) * push;
          }
        }
      }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#C9D2E1";

    // 亮度分桶，减少 globalAlpha 切换
    for (let bucket = 0; bucket < 8; bucket++) {
      ctx.globalAlpha = ((bucket + 0.6) / 8) * 0.92;
      for (let i = 0; i < COUNT; i++) {
        const near = Math.min(1, Math.max(0, 1 - Math.hypot(posX[i] - cx, posY[i] - cy) / (Math.max(W, H) * 0.7)));
        const level = Math.min(7, Math.floor(8 * (0.35 + near * 0.65)));
        if (level !== bucket) continue;
        const s = scale[i];
        ctx.fillRect(posX[i] - s / 2, posY[i] - s / 2, s, s);
      }
    }

    ctx.fillStyle = "#6E8BFF";
    ctx.globalAlpha = 0.95;
    for (let i = 0; i < COUNT; i += 47) {
      const s = scale[i] * 1.1;
      ctx.fillRect(posX[i] - s / 2, posY[i] - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  raf = requestAnimationFrame(frame);

  /* ─────────────────────────────
     三、滚动驱动的形态切换
     每个 chapter 带 data-state，滚到哪块就换成哪套目标点，
     每颗粒子有独立的启动延迟，所以换形态是"错峰流动"而不是整体平移。
     ───────────────────────────── */
  const morphCanvas = document.getElementById("morph-canvas");
  const mctx = morphCanvas.getContext("2d");
  const MCOUNT = 1600;
  const mRand = mulberry32(0x5e11a);

  function samplePoints(fn) {
    const arr = new Float32Array(MCOUNT * 2);
    for (let i = 0; i < MCOUNT; i++) {
      const p = fn();
      arr[i * 2] = p[0];
      arr[i * 2 + 1] = p[1];
    }
    return arr;
  }

  function textMask(text) {
    const off = document.createElement("canvas");
    off.width = 900; off.height = 280;
    const c = off.getContext("2d");
    c.fillStyle = "#fff";
    c.font = "600 150px ui-serif, Georgia, serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(text, 450, 145);
    const d = c.getImageData(0, 0, off.width, off.height).data;
    const pts = [];
    for (let y = 0; y < off.height; y += 2)
      for (let x = 0; x < off.width; x += 2)
        if (d[(y * off.width + x) * 4 + 3] > 140) pts.push([x / off.width, y / off.height]);
    return pts;
  }

  const logoSrc = textMask("RAIN LAND");

  const SHAPES = {
    logo: { aspect: 900 / 280, pts: samplePoints(() => logoSrc[(mRand() * logoSrc.length) | 0]) },
    lattice: { aspect: 1, pts: samplePoints(() => {
      const n = 45;
      return [((mRand() * n) | 0) / (n - 1), ((mRand() * n) | 0) / (n - 1)];
    }) },
    venn: { aspect: 1, pts: samplePoints(() => {
      const cx = 0.5 + (mRand() < 0.5 ? -0.16 : 0.16);
      const a = mRand() * Math.PI * 2;
      return [cx + Math.cos(a) * 0.17, 0.5 + Math.sin(a) * 0.17];
    }) },
    chladni: { aspect: 1, pts: samplePoints(() => {
      for (;;) {
        const x = mRand(), y = mRand();
        if (Math.abs(Math.sin(3 * Math.PI * x) * Math.sin(3 * Math.PI * y)) < 0.06) return [x, y];
      }
    }) },
    stream: { aspect: 2, pts: samplePoints(() => {
      const x = mRand();
      return [x, 0.5 + Math.sin(x * Math.PI * 4) * 0.18 + (mRand() - 0.5) * 0.06];
    }) },
    drift: { aspect: 1, pts: samplePoints(() => [0.5 + (mRand() - 0.5) * 0.72, 0.5 + (mRand() - 0.5) * 0.72]) },
    // 斜置椭圆环：每颗粒子有自己的角度和半轴，随时间绕一圈
    loop: (() => {
      const pts = new Float32Array(MCOUNT * 2);
      const angles = new Float32Array(MCOUNT);
      const rx = new Float32Array(MCOUNT);
      const ry = new Float32Array(MCOUNT);
      for (let i = 0; i < MCOUNT; i++) {
        const a = mRand() * Math.PI * 2;
        const jitter = (mRand() - 0.5) * 0.03;
        angles[i] = a;
        rx[i] = 0.30 + jitter;
        ry[i] = 0.10 + jitter * 0.4;
        pts[i * 2] = 0.5 + Math.cos(a) * rx[i];
        pts[i * 2 + 1] = 0.5 + Math.sin(a) * ry[i];
      }
      return { aspect: 1, pts, angles, rx, ry };
    })(),
  };

  const mPosX = new Float32Array(MCOUNT);
  const mPosY = new Float32Array(MCOUNT);
  const mDelay = new Float32Array(MCOUNT);
  const mStiff = new Float32Array(MCOUNT);
  const mSize = new Float32Array(MCOUNT);
  const mPhase = new Float32Array(MCOUNT);   // 各自的呼吸/摆动相位
  const mSpeed = new Float32Array(MCOUNT);
  const mIdle = new Float32Array(MCOUNT);    // 常态微动幅度

  for (let i = 0; i < MCOUNT; i++) {
    mPosX[i] = 0;
    mPosY[i] = 0;
    mStiff[i] = 0.03 + mRand() * 0.06;
    mSize[i] = 1 + mRand() * 2.4;
    mPhase[i] = mRand() * Math.PI * 2;
    mSpeed[i] = 0.0004 + mRand() * 0.0006;
    mIdle[i] = 4 + mRand() * 10;
  }

  let mState = "";
  let mSwitchAt = 0;
  let mReady = false;

  function setShape(name) {
    if (name === mState || !SHAPES[name]) return;
    mState = name;
    mSwitchAt = performance.now();
    for (let i = 0; i < MCOUNT; i++) {
      mDelay[i] = mRand() * 550;   // 错峰 0–550ms
      mStiff[i] = 0.03 + mRand() * 0.06;
    }
  }

  function resizeMorph() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    morphCanvas.width = Math.round(morphCanvas.clientWidth * dpr);
    morphCanvas.height = Math.round(morphCanvas.clientHeight * dpr);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeMorph();
  addEventListener("resize", resizeMorph);

  const chapters = [...document.querySelectorAll(".chapter")];
  let mPrev = 0;

  function morphFrame(now) {
    requestAnimationFrame(morphFrame);
    const dt = mPrev ? Math.min(now - mPrev, 50) : 16.7;
    mPrev = now;

    // 选中离视口中线最近的章节
    const mid = innerHeight / 2;
    let best = null, bestDist = Infinity;
    for (const chapter of chapters) {
      const r = chapter.getBoundingClientRect();
      const d = Math.abs(r.top + r.height / 2 - mid);
      if (r.bottom > 0 && r.top < innerHeight && d < bestDist) { best = chapter; bestDist = d; }
    }
    if (best) setShape(best.dataset.state);

    const shape = SHAPES[mState] || SHAPES.logo;
    const W = morphCanvas.clientWidth, H = morphCanvas.clientHeight;
    // 位置全部存像素坐标：换形态时旧图形不会被新宽高比立刻拉扯，
    // 只有被"唤醒"的粒子才开始移动。
    const boxW = Math.min(W * 0.76, 900);
    const boxH = boxW / shape.aspect;
    const cx = W / 2, cy = H / 2;
    const elapsed = now - mSwitchAt;

    if (!mReady) {
      for (let i = 0; i < MCOUNT; i++) {
        mPosX[i] = cx + (shape.pts[i * 2] - 0.5) * boxW + (mRand() - 0.5) * 30;
        mPosY[i] = cy + (shape.pts[i * 2 + 1] - 0.5) * boxH + (mRand() - 0.5) * 30;
      }
      mReady = true;
    }

    mctx.clearRect(0, 0, W, H);

    const layers = [[], [], [], []];
    const accent = [];
    for (let i = 0; i < MCOUNT; i++) {
      let nx = shape.pts[i * 2];
      let ny = shape.pts[i * 2 + 1];
      let isAccent = false;

      // 环形态：粒子沿椭圆自己绕圈，并有一段蓝色高亮跟着转
      if (shape.angles) {
        const a = shape.angles[i] + now * 0.00018;
        nx = 0.5 + Math.cos(a) * shape.rx[i];
        ny = 0.5 + Math.sin(a) * shape.ry[i];
        const hi = (now * 0.00045) % (Math.PI * 2);
        const diff = Math.abs((((a - hi) % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
        isAccent = diff < 0.45;
      }

      // 目标点自带缓慢摆动，形态稳定后画面仍然在动
      const sway = reduceMotion.matches ? 0 : mIdle[i];
      const tgtX = cx + (nx - 0.5) * boxW + Math.sin(now * mSpeed[i] + mPhase[i]) * sway;
      const tgtY = cy + (ny - 0.5) * boxH + Math.cos(now * mSpeed[i] * 0.83 + mPhase[i]) * sway;

      if (!reduceMotion.matches && elapsed > mDelay[i]) {
        const k = 1 - Math.pow(1 - mStiff[i], dt / 16.7);
        mPosX[i] += (tgtX - mPosX[i]) * k;
        mPosY[i] += (tgtY - mPosY[i]) * k;
      }

      if (isAccent) { accent.push(i); continue; }

      // 亮度跟各自相位，不跟"离目标多远"，否则换形态时全体一起闪
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.0016 + mPhase[i]);
      layers[Math.min(3, Math.floor(pulse * 4))].push(i);
    }

    mctx.fillStyle = "#C9D2E1";
    const alphas = [0.3, 0.5, 0.72, 0.95];
    for (let b = 0; b < 4; b++) {
      mctx.globalAlpha = alphas[b];
      for (const i of layers[b]) {
        const s = mSize[i];
        mctx.fillRect(mPosX[i] - s / 2, mPosY[i] - s / 2, s, s);
      }
    }

    // 环上的高亮段
    mctx.fillStyle = "#6E8BFF";
    mctx.globalAlpha = 0.95;
    for (const i of accent) {
      const s = mSize[i] * 1.2;
      mctx.fillRect(mPosX[i] - s / 2, mPosY[i] - s / 2, s, s);
    }
    mctx.globalAlpha = 1;
  }
  requestAnimationFrame(morphFrame);

  /* ─────────────────────────────
     四、固定点阵 + 行进波带
     点不动，是"波"经过时把它们逐个点亮
     ───────────────────────────── */
  const dotCanvas = document.getElementById("dot-canvas");
  const dctx = dotCanvas.getContext("2d");
  let dots = [], dotW = 0, dotH = 0, ripple = null;
  const dotsSection = document.getElementById("dots");
  dotsSection.addEventListener("pointermove", (event) => {
    const r = dotsSection.getBoundingClientRect();
    ripple = { x: event.clientX - r.left, y: event.clientY - r.top, t: performance.now() };
  });

  function resizeDots() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    dotW = dotCanvas.clientWidth;
    dotH = dotCanvas.clientHeight;
    dotCanvas.width = Math.round(dotW * dpr);
    dotCanvas.height = Math.round(dotH * dpr);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const gap = 26;
    dots = [];
    for (let y = gap / 2; y < dotH; y += gap)
      for (let x = gap / 2; x < dotW; x += gap) dots.push(x, y);
  }
  resizeDots();
  addEventListener("resize", resizeDots);

  function dotFrame(now) {
    requestAnimationFrame(dotFrame);
    if (!dotW) return;
    const t = now * 0.001;

    // 波心缓慢漂移，波带一圈圈向外推
    const ox = dotW * (0.5 + 0.3 * Math.sin(t * 0.23));
    const oy = dotH * (0.5 + 0.28 * Math.cos(t * 0.19));

    dctx.clearRect(0, 0, dotW, dotH);

    dctx.fillStyle = "rgba(160, 185, 225, 0.18)";
    for (let i = 0; i < dots.length; i += 2) dctx.fillRect(dots[i] - 1, dots[i + 1] - 1, 2, 2);

    // 单道波前向外扩散，高斯衰减：点被扫过时亮起再熄灭
    const maxR = Math.hypot(dotW, dotH) * 0.62;
    const front = (t * 130) % (maxR + 280);

    // 鼠标涟漪：以指针为圆心扩散一圈
    const rippleAge = ripple ? now - ripple.t : Infinity;
    const rippleR = rippleAge * 0.35;
    const rippleFade = Math.max(0, 1 - rippleAge / 900);

    dctx.fillStyle = "#6E8BFF";
    for (let i = 0; i < dots.length; i += 2) {
      const dx = dots[i] - ox;
      const dy = dots[i + 1] - oy;
      let k = Math.exp(-Math.pow((Math.sqrt(dx * dx + dy * dy) - front) / 55, 2));

      if (rippleFade > 0) {
        const rx = dots[i] - ripple.x;
        const ry = dots[i + 1] - ripple.y;
        const kr = Math.exp(-Math.pow((Math.sqrt(rx * rx + ry * ry) - rippleR) / 28, 2)) * rippleFade;
        if (kr > k) k = kr;
      }

      if (k < 0.06) continue;
      const s = 2 + k * 3;
      dctx.globalAlpha = 0.2 + k * 0.8;
      dctx.fillRect(dots[i] - s / 2, dots[i + 1] - s / 2, s, s);
    }
    dctx.globalAlpha = 1;
  }
  requestAnimationFrame(dotFrame);

  /* ─────────────────────────────
     五、雨滴沉积
     雨滴是粒子，落点由"高度图"记住：一列一格的数值，
     越积越高，画面底部就长出一条起伏的水面。
     ───────────────────────────── */
  const rainCanvas = document.getElementById("rain-canvas");
  const rctx = rainCanvas.getContext("2d");
  const RAIN_COLS = 64;
  const heights = new Float32Array(RAIN_COLS);   // 每列的水位 0~1
  const rainScratch = new Float32Array(RAIN_COLS);
  const drops = [];
  const MAX_FILL = 0.55;                    // 最多堆到屏高的 62%
  let rainW = 0, rainH = 0, rainPrev = 0;

  function resizeRain() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    rainW = rainCanvas.clientWidth;
    rainH = rainCanvas.clientHeight;
    rainCanvas.width = Math.round(rainW * dpr);
    rainCanvas.height = Math.round(rainH * dpr);
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeRain();
  addEventListener("resize", resizeRain);

  for (let i = 0; i < 450; i++) {
    drops.push({ x: Math.random(), y: Math.random(), v: 0.0022 + Math.random() * 0.0032 });
  }

  const surfaceY = (col) => rainH * (1 - MAX_FILL * heights[col]);

  function rainFrame(now) {
    requestAnimationFrame(rainFrame);
    if (!rainW) return;
    const dt = rainPrev ? Math.min(now - rainPrev, 50) : 16.7;
    rainPrev = now;

    rctx.clearRect(0, 0, rainW, rainH);

    // 缓慢蒸发，水位才不会无限涨
    for (let c = 0; c < RAIN_COLS; c++) heights[c] *= 0.9993;

    // 横向扩散：让堆积有坡度，而不是每列各长各的
    rainScratch.set(heights);
    for (let c = 1; c < RAIN_COLS - 1; c++) {
      heights[c] += (rainScratch[c - 1] + rainScratch[c + 1] - 2 * rainScratch[c]) * 0.04;
    }

    rctx.fillStyle = "rgba(160, 185, 225, 0.55)";
    for (const drop of drops) {
      drop.y += drop.v * dt;
      const col = Math.min(RAIN_COLS - 1, Math.max(0, Math.floor(drop.x * RAIN_COLS)));
      if (drop.y * rainH > surfaceY(col)) {
        heights[col] = Math.min(0.92, heights[col] + 0.003);
        drop.y = -0.05;
        // 三角形分布：中间落得多，堆起来才有"山"的形状
        drop.x = (Math.random() + Math.random()) / 2;
        continue;
      }
      rctx.fillRect(drop.x * rainW, drop.y * rainH, 1, 6);
    }

    // 水面
    const surf = new Path2D();
    surf.moveTo(0, rainH);
    for (let c = 0; c < RAIN_COLS; c++) surf.lineTo((c / (RAIN_COLS - 1)) * rainW, surfaceY(c));
    surf.lineTo(rainW, rainH);
    surf.closePath();

    const grad = rctx.createLinearGradient(0, rainH * 0.4, 0, rainH);
    grad.addColorStop(0, "rgba(114, 168, 216, 0.3)");
    grad.addColorStop(1, "rgba(114, 168, 216, 0.05)");
    rctx.fillStyle = grad;
    rctx.fill(surf);

    rctx.beginPath();
    for (let c = 0; c < RAIN_COLS; c++) {
      const x = (c / (RAIN_COLS - 1)) * rainW;
      const y = surfaceY(c);
      if (c === 0) rctx.moveTo(x, y);
      else rctx.lineTo(x, y);
    }
    rctx.strokeStyle = "rgba(114, 168, 216, 0.75)";
    rctx.lineWidth = 1.5;
    rctx.stroke();
  }
  requestAnimationFrame(rainFrame);

  /* ─────────────────────────────
     六、聚光 + 线条生长
     ───────────────────────────── */
  const spot = document.getElementById("spot");
  const spotPaths = [...spot.querySelectorAll(".grow-line path")];
  const spotLens = spotPaths.map((path) => path.getTotalLength());

  spotPaths.forEach((path, i) => {
    path.style.strokeDasharray = spotLens[i];
    path.style.strokeDashoffset = spotLens[i];
  });

  spot.addEventListener("pointermove", (event) => {
    const r = spot.getBoundingClientRect();
    spot.style.setProperty("--mx", `${event.clientX - r.left}px`);
    spot.style.setProperty("--my", `${event.clientY - r.top}px`);
  });

  function growFrame() {
    requestAnimationFrame(growFrame);
    const r = spot.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, 1 - r.top / innerHeight));
    spotPaths.forEach((path, i) => {
      const local = Math.min(1, Math.max(0, (p - i * 0.14) / 0.72));
      path.style.strokeDashoffset = spotLens[i] * (1 - local);
    });
  }
  requestAnimationFrame(growFrame);
})();
</script>
</body>
</html>
