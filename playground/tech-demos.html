<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技术栈试验：拖尾像素 / 粒子场</title>
<style>
  :root {
    --bg: #0b1020;
    --fg: #cbd4e5;
    --muted: #7f8dad;
    --line: rgba(160, 185, 225, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.7 ui-sans-serif, system-ui, "Noto Sans SC", sans-serif; }
  header {
    position: fixed; inset: 0 0 auto; z-index: 10;
    display: flex; gap: 20px; align-items: center;
    padding: 14px 24px; font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
    background: linear-gradient(var(--bg), transparent);
  }
  header a { color: inherit; text-decoration: none; }
  header a:hover { color: var(--fg); }
  section {
    position: relative; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .caption {
    position: relative; z-index: 2; text-align: center; pointer-events: none;
    background: color-mix(in oklab, var(--bg) 70%, transparent);
    padding: 12px 20px; border: 1px solid var(--line);
  }
  .caption h1 { margin: 0 0 4px; font-size: 22px; font-weight: 400; letter-spacing: .1em; }
  .caption p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  /* 粒子区块的标题挪到顶部，别压住字形 */
  #particles .caption { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); }

  /* ── 一、拖尾像素 ── */
  #trail-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .trail-pixel {
    transform-box: fill-box;
    transform-origin: 50%;
    transform: scale(1);
    transition: transform .5s cubic-bezier(.3, .41, .04, 1.01);
  }
  .trail-pixel.exit { transform: scale(0); }

  /* ── 二、粒子场 ── */
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 三、滚动变形 ── */
  /* overflow 必须可见，否则 sticky 的 canvas 不会相对视口固定 */
  #morph { position: relative; height: auto; display: block; overflow: visible; }
  #morph-canvas {
    position: sticky; top: 0;
    width: 100%; height: 100vh; display: block; z-index: 0;
  }
  .chapters { position: relative; margin-top: -100vh; z-index: 1; }
  .chapter {
    height: 100vh; display: flex; align-items: center; justify-content: flex-start;
    padding-left: 8vw; pointer-events: none;
  }
  .chapter span {
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--muted); background: color-mix(in oklab, var(--bg) 65%, transparent);
    padding: 8px 14px; border: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <a href="#trail">① 拖尾像素</a>
  <a href="#particles">② 粒子场</a>
  <a href="#morph">③ 滚动变形</a>
</header>

<!-- ══════════ 一、GitHub 式拖尾像素 ══════════ -->
<section id="trail">
  <svg id="trail-svg" viewBox="0 0 143 84" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
        <path d="M 1 0 H 0 V 1" fill="none" stroke="rgba(160,185,225,0.10)" stroke-width="0.08"/>
      </pattern>
    </defs>
    <rect width="143" height="84" fill="url(#grid)"/>
    <g id="trail-layer"></g>
  </svg>

  <div class="caption">
    <h1>拖尾像素</h1>
    <p>鼠标划过 · 1×1 单位 = 屏幕 10px · scale 0.5s 退场</p>
  </div>
</section>

<!-- ══════════ 二、2D canvas 粒子场 ══════════ -->
<section id="particles">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="caption">
    <h1>粒子场</h1>
    <p>TypedArray · 种子随机 · 遮罩采样 · 鼠标排斥</p>
  </div>
</section>

<!-- ══════════ 三、滚动驱动的形态切换 ══════════ -->
<section id="morph">
  <canvas id="morph-canvas" aria-hidden="true"></canvas>
  <div class="chapters">
    <div class="chapter" data-state="logo"><span>① 标识 · LOGO</span></div>
    <div class="chapter" data-state="lattice"><span>② 晶格 · LATTICE</span></div>
    <div class="chapter" data-state="venn"><span>③ 维恩 · VENN</span></div>
    <div class="chapter" data-state="chladni"><span>④ 克拉尼图形 · CHLADNI</span></div>
    <div class="chapter" data-state="stream"><span>⑤ 流 · STREAM</span></div>
    <div class="chapter" data-state="drift"><span>⑥ 弥散 · DRIFT</span></div>
  </div>
</section>

<script>
(() => {
  "use strict";

  /* ─────────────────────────────
     一、拖尾像素（复刻 GitHub 的做法）
     屏幕坐标 → 143×84 网格 → 插 1×1 <rect> → scale(0) 退场
     ───────────────────────────── */
  const svg = document.getElementById("trail-svg");
  const layer = document.getElementById("trail-layer");
  const NS = "http://www.w3.org/2000/svg";
  const COLS = 143, ROWS = 84;
  const PALETTE = ["#5FED83", "#23EA57", "#08872B", "#C898FD", "#FFB757"];
  const THROTTLE_MS = 30;

  let lastSpawn = 0;

  svg.addEventListener("pointermove", (event) => {
    const now = performance.now();
    if (now - lastSpawn < THROTTLE_MS) return;
    lastSpawn = now;

    const box = svg.getBoundingClientRect();
    const gx = Math.floor(((event.clientX - box.left) / box.width) * COLS);
    const gy = Math.floor(((event.clientY - box.top) / box.height) * ROWS);
    if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;

    const pixel = document.createElementNS(NS, "rect");
    pixel.setAttribute("x", gx);
    pixel.setAttribute("y", gy);
    pixel.setAttribute("width", 1);
    pixel.setAttribute("height", 1);
    pixel.setAttribute("fill", PALETTE[(Math.random() * PALETTE.length) | 0]);
    pixel.setAttribute("class", "trail-pixel");
    layer.appendChild(pixel);

    // 两帧之后再加退出类，确保 scale(1) 已经生效
    requestAnimationFrame(() => requestAnimationFrame(() => pixel.classList.add("exit")));
    pixel.addEventListener("transitionend", () => pixel.remove(), { once: true });
  });

  /* ─────────────────────────────
     二、粒子场（复刻 innuno 的做法）
     Float32Array + mulberry32 + Box-Muller + 遮罩采样 + 亮度分桶
     ───────────────────────────── */
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d");
  const COUNT = 1400;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  function mulberry32(seed) {
    return () => {
      seed |= 0;
      let t = Math.imul((seed = (seed + 0x6d2b79f5) | 0), seed >>> 15 | 1);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(0x134b101);
  const gauss = () => Math.sqrt(-2 * Math.log(rand() || 1e-9)) * Math.cos(2 * Math.PI * rand());

  // 用文字做遮罩，采样不透明像素作为粒子的家
  function sampleMask(text) {
    const off = document.createElement("canvas");
    off.width = 560; off.height = 180;
    const c = off.getContext("2d");
    c.fillStyle = "#fff";
    c.font = "600 96px ui-serif, Georgia, serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(text, 280, 92);

    const px = c.getImageData(0, 0, off.width, off.height).data;
    const points = [];
    for (let y = 0; y < off.height; y += 2) {
      for (let x = 0; x < off.width; x += 2) {
        if (px[(y * off.width + x) * 4 + 3] > 140) points.push(x / off.width, y / off.height);
      }
    }
    return points;
  }

  const mask = sampleMask("RAIN LAND");
  const anchorCount = mask.length / 2;

  const homeX = new Float32Array(COUNT);
  const homeY = new Float32Array(COUNT);
  const posX = new Float32Array(COUNT);
  const posY = new Float32Array(COUNT);
  const scale = new Float32Array(COUNT);
  const ease = new Float32Array(COUNT);

  for (let i = 0; i < COUNT; i++) {
    const pick = ((rand() * anchorCount) | 0) * 2;
    homeX[i] = mask[pick];
    homeY[i] = mask[pick + 1];
    posX[i] = 0.5 + gauss() * 0.12;
    posY[i] = 0.5 + gauss() * 0.12;
    scale[i] = 1.2 + rand() * 2.6;
    ease[i] = 0.03 + rand() * 0.05;
  }

  let W = 0, H = 0, DPR = 1;
  const pointer = { x: -9999, y: -9999, active: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  canvas.parentElement.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
    pointer.active = true;
  });
  canvas.parentElement.addEventListener("pointerleave", () => { pointer.active = false; });

  let raf = 0, prev = 0;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = prev ? Math.min(now - prev, 50) : 16.7;
    prev = now;

    const cx = W * 0.5, cy = H * 0.5;
    // 按遮罩（560×180）的宽高比等比铺开，避免字形被拉出屏幕
    const textW = Math.min(W * 0.76, 880);
    const textH = (textW * 180) / 560;

    if (!reduceMotion.matches) {
      for (let i = 0; i < COUNT; i++) {
        const tx = cx + (homeX[i] - 0.5) * textW;
        const ty = cy + (homeY[i] - 0.5) * textH;
        const k = 1 - Math.pow(1 - ease[i], dt / 16.7);
        posX[i] += (tx - posX[i]) * k;
        posY[i] += (ty - posY[i]) * k;

        if (pointer.active) {
          const dx = posX[i] - pointer.x;
          const dy = posY[i] - pointer.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < 8464) {
            const dist = Math.sqrt(distSq) || 1;
            const push = (1 - dist / 92) * 2.4 * (dt / 16.7);
            posX[i] += (dx / dist) * push;
            posY[i] += (dy / dist) * push;
          }
        }
      }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#C9D2E1";

    // 亮度分桶，减少 globalAlpha 切换
    for (let bucket = 0; bucket < 8; bucket++) {
      ctx.globalAlpha = ((bucket + 0.6) / 8) * 0.92;
      for (let i = 0; i < COUNT; i++) {
        const near = Math.min(1, Math.max(0, 1 - Math.hypot(posX[i] - cx, posY[i] - cy) / (Math.max(W, H) * 0.7)));
        const level = Math.min(7, Math.floor(8 * (0.35 + near * 0.65)));
        if (level !== bucket) continue;
        const s = scale[i];
        ctx.fillRect(posX[i] - s / 2, posY[i] - s / 2, s, s);
      }
    }

    ctx.fillStyle = "#6E8BFF";
    ctx.globalAlpha = 0.95;
    for (let i = 0; i < COUNT; i += 47) {
      const s = scale[i] * 1.1;
      ctx.fillRect(posX[i] - s / 2, posY[i] - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  raf = requestAnimationFrame(frame);

  /* ─────────────────────────────
     三、滚动驱动的形态切换
     每个 chapter 带 data-state，滚到哪块就换成哪套目标点，
     每颗粒子有独立的启动延迟，所以换形态是"错峰流动"而不是整体平移。
     ───────────────────────────── */
  const morphCanvas = document.getElementById("morph-canvas");
  const mctx = morphCanvas.getContext("2d");
  const MCOUNT = 1600;
  const mRand = mulberry32(0x5e11a);

  function samplePoints(fn) {
    const arr = new Float32Array(MCOUNT * 2);
    for (let i = 0; i < MCOUNT; i++) {
      const p = fn();
      arr[i * 2] = p[0];
      arr[i * 2 + 1] = p[1];
    }
    return arr;
  }

  function textMask(text) {
    const off = document.createElement("canvas");
    off.width = 900; off.height = 280;
    const c = off.getContext("2d");
    c.fillStyle = "#fff";
    c.font = "600 150px ui-serif, Georgia, serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(text, 450, 145);
    const d = c.getImageData(0, 0, off.width, off.height).data;
    const pts = [];
    for (let y = 0; y < off.height; y += 2)
      for (let x = 0; x < off.width; x += 2)
        if (d[(y * off.width + x) * 4 + 3] > 140) pts.push([x / off.width, y / off.height]);
    return pts;
  }

  const logoSrc = textMask("RAIN LAND");

  const SHAPES = {
    logo: { aspect: 900 / 280, pts: samplePoints(() => logoSrc[(mRand() * logoSrc.length) | 0]) },
    lattice: { aspect: 1, pts: samplePoints(() => {
      const n = 45;
      return [((mRand() * n) | 0) / (n - 1), ((mRand() * n) | 0) / (n - 1)];
    }) },
    venn: { aspect: 1, pts: samplePoints(() => {
      const cx = 0.5 + (mRand() < 0.5 ? -0.16 : 0.16);
      const a = mRand() * Math.PI * 2;
      return [cx + Math.cos(a) * 0.17, 0.5 + Math.sin(a) * 0.17];
    }) },
    chladni: { aspect: 1, pts: samplePoints(() => {
      for (;;) {
        const x = mRand(), y = mRand();
        if (Math.abs(Math.sin(3 * Math.PI * x) * Math.sin(3 * Math.PI * y)) < 0.06) return [x, y];
      }
    }) },
    stream: { aspect: 2, pts: samplePoints(() => {
      const x = mRand();
      return [x, 0.5 + Math.sin(x * Math.PI * 4) * 0.18 + (mRand() - 0.5) * 0.06];
    }) },
    drift: { aspect: 1, pts: samplePoints(() => [0.5 + (mRand() - 0.5) * 0.72, 0.5 + (mRand() - 0.5) * 0.72]) },
  };

  const mPosX = new Float32Array(MCOUNT);
  const mPosY = new Float32Array(MCOUNT);
  const mDelay = new Float32Array(MCOUNT);
  const mStiff = new Float32Array(MCOUNT);
  const mSize = new Float32Array(MCOUNT);
  const mPhase = new Float32Array(MCOUNT);   // 各自的呼吸/摆动相位
  const mSpeed = new Float32Array(MCOUNT);
  const mIdle = new Float32Array(MCOUNT);    // 常态微动幅度

  for (let i = 0; i < MCOUNT; i++) {
    mPosX[i] = 0;
    mPosY[i] = 0;
    mStiff[i] = 0.03 + mRand() * 0.06;
    mSize[i] = 1 + mRand() * 2.4;
    mPhase[i] = mRand() * Math.PI * 2;
    mSpeed[i] = 0.0004 + mRand() * 0.0006;
    mIdle[i] = 4 + mRand() * 10;
  }

  let mState = "";
  let mSwitchAt = 0;
  let mReady = false;

  function setShape(name) {
    if (name === mState || !SHAPES[name]) return;
    mState = name;
    mSwitchAt = performance.now();
    for (let i = 0; i < MCOUNT; i++) {
      mDelay[i] = mRand() * 550;   // 错峰 0–550ms
      mStiff[i] = 0.03 + mRand() * 0.06;
    }
  }

  function resizeMorph() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    morphCanvas.width = Math.round(morphCanvas.clientWidth * dpr);
    morphCanvas.height = Math.round(morphCanvas.clientHeight * dpr);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeMorph();
  addEventListener("resize", resizeMorph);

  const chapters = [...document.querySelectorAll(".chapter")];
  let mPrev = 0;

  function morphFrame(now) {
    requestAnimationFrame(morphFrame);
    const dt = mPrev ? Math.min(now - mPrev, 50) : 16.7;
    mPrev = now;

    // 选中离视口中线最近的章节
    const mid = innerHeight / 2;
    let best = null, bestDist = Infinity;
    for (const chapter of chapters) {
      const r = chapter.getBoundingClientRect();
      const d = Math.abs(r.top + r.height / 2 - mid);
      if (r.bottom > 0 && r.top < innerHeight && d < bestDist) { best = chapter; bestDist = d; }
    }
    if (best) setShape(best.dataset.state);

    const shape = SHAPES[mState] || SHAPES.logo;
    const W = morphCanvas.clientWidth, H = morphCanvas.clientHeight;
    // 位置全部存像素坐标：换形态时旧图形不会被新宽高比立刻拉扯，
    // 只有被"唤醒"的粒子才开始移动。
    const boxW = Math.min(W * 0.76, 900);
    const boxH = boxW / shape.aspect;
    const cx = W / 2, cy = H / 2;
    const elapsed = now - mSwitchAt;

    if (!mReady) {
      for (let i = 0; i < MCOUNT; i++) {
        mPosX[i] = cx + (shape.pts[i * 2] - 0.5) * boxW + (mRand() - 0.5) * 30;
        mPosY[i] = cy + (shape.pts[i * 2 + 1] - 0.5) * boxH + (mRand() - 0.5) * 30;
      }
      mReady = true;
    }

    mctx.clearRect(0, 0, W, H);

    const layers = [[], [], [], []];
    for (let i = 0; i < MCOUNT; i++) {
      // 目标点自带缓慢摆动，形态稳定后画面仍然在动
      const sway = reduceMotion.matches ? 0 : mIdle[i];
      const tgtX = cx + (shape.pts[i * 2] - 0.5) * boxW + Math.sin(now * mSpeed[i] + mPhase[i]) * sway;
      const tgtY = cy + (shape.pts[i * 2 + 1] - 0.5) * boxH + Math.cos(now * mSpeed[i] * 0.83 + mPhase[i]) * sway;

      if (!reduceMotion.matches && elapsed > mDelay[i]) {
        const k = 1 - Math.pow(1 - mStiff[i], dt / 16.7);
        mPosX[i] += (tgtX - mPosX[i]) * k;
        mPosY[i] += (tgtY - mPosY[i]) * k;
      }

      // 亮度跟各自相位，不跟"离目标多远"，否则换形态时全体一起闪
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.0016 + mPhase[i]);
      layers[Math.min(3, Math.floor(pulse * 4))].push(i);
    }

    mctx.fillStyle = "#C9D2E1";
    const alphas = [0.3, 0.5, 0.72, 0.95];
    for (let b = 0; b < 4; b++) {
      mctx.globalAlpha = alphas[b];
      for (const i of layers[b]) {
        const s = mSize[i];
        mctx.fillRect(mPosX[i] - s / 2, mPosY[i] - s / 2, s, s);
      }
    }
    mctx.globalAlpha = 1;
  }
  requestAnimationFrame(morphFrame);
})();
</script>
</body>
</html>
